# Cloudflare Tunnel is still configured fully with zero open ports, IP swap not needed.
# User only need replace YOUR_VM_IP / ai.yourdomain.com
tunnel: deepseek-prod
ingress:
  - hostname: ai.yourdomain.com
    service: http://localhost:3000
  - service: http_status:404

# Quick command (test):
# cloudflared tunnel --url http://localhost:3000
# Permanent:
# 1. Dash > Zero Trust > Tunnels > Create tunnel > deepseek-prod
# 2. Copy token, then on VM:
# sudo cloudflared service install YOUR_TOKEN
# sudo systemctl enable --now cloudflared
# 3. Public Hostname: ai.yourdomain.com -> http://localhost:3000
