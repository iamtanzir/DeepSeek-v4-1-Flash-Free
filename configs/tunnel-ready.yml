# Cloudflare Tunnel configuration (locally-managed tunnel).
#
# You only need this file if you created a tunnel with `cloudflared tunnel
# create` and want to run the connector yourself. If you created the tunnel in
# the Zero Trust dashboard and installed its token, the dashboard owns the
# ingress rules and you can ignore this file.
#
# Replace YOUR_TUNNEL_UUID and the hostname, then:
#   sudo cloudflared service install
#   sudo systemctl enable --now cloudflared

tunnel: YOUR_TUNNEL_UUID
credentials-file: /etc/cloudflared/YOUR_TUNNEL_UUID.json

ingress:
  - hostname: ai.yourdomain.com
    service: http://localhost:3000
  - service: http_status:404
